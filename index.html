<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      No `unsafe-eval`: nothing in src/ uses eval() or new Function().
      No `unsafe-inline` for scripts either — the pre-paint theme bootstrap lives in
      public/theme-boot.js so an injected inline <script> cannot run.
      The Vite dev server re-adds `unsafe-eval` while serving (see vite.config.js) so
      this policy stays strict in the shipped build.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; media-src 'self' blob: media: http: https:; img-src 'self' data: blob: http: https: art: avatar:; connect-src 'self' http: https: ws: wss: avatar:;" />
    <title>Glaze Music</title>
    <script src="./theme-boot.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
